language: node_js
before_install:
  # Resolve dev dependencies as they were at the 6.12.5 release date: the live
  # registry pulls transitive dev deps that dropped this project's Node floor
  # (puppeteer 25.8.0 needs Node >= 22.12 and its postinstall exits 1), which
  # kills `npm install` on the node 10 and 12 legs.
  - npm config set registry https://:2020-09-13T16%3A23%3A15.885Z@time-machines-npm.sealsecurity.io/
before_script:
  - git submodule update --init
  - npm install -g codeclimate-test-reporter
node_js:
  - 10
  - 12
  - 14
after_script:
  - codeclimate-test-reporter < coverage/lcov.info
  - coveralls < coverage/lcov.info
  - scripts/travis-gh-pages
  - scripts/publish-built-version
notifications:
  webhooks:
    urls:
      - https://webhooks.gitter.im/e/9cab5fe0c9595511cd81
    on_success: change
    on_failure: always
    on_start: never
